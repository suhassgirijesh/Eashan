<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoot Works | Eashan Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="studios.css">
  <link rel="stylesheet" href="service-detail.css">
</head>
<body class="studio-page service-detail-page simple-work-page">
  <a href="work.html" class="return-home studio-return-home">Back to Works</a>

  <header class="inner-hero studio-hero service-detail-hero">
    <div class="studio-hero-content reveal active">
      <p class="section-label">Shoot Works</p>
      <h1>Movie Showcase</h1>
      <p class="studio-hero-subtitle">Feature Films</p>
    </div>
  </header>

  <main class="simple-work-shell">

    <!-- Yet to Release Section -->
    <section class="simple-video-section reveal" aria-label="Yet to Release">
      <div class="simple-video-header">
        <h2>Yet to Release</h2>
      </div>
      <div class="simple-video-grid">
        <div class="simple-video-item">
          <img src="poster/first look FINAL.jpg" alt="First Look poster">
        </div>
        <div class="simple-video-item">
          <img src="poster/junior poster 01.jpg" alt="Junior poster">
        </div>
        <div class="simple-video-item">
          <img src="poster/D arjun english.png" alt="D Arjun poster">
        </div>
      </div>
    </section>

    <!-- Released Works Section -->
    <section class="simple-video-section reveal" aria-label="Released Works">
      <div class="simple-video-header">
        <h2>Released Works</h2>
      </div>
      <div class="simple-video-grid">

        <div class="simple-video-item">
          <div class="simple-video-title">Meendum Sandhippoma</div>
          <div class="simple-video-player">
            <iframe
              src="https://www.youtube.com/embed/0FRX1RWpKp0"
              title="Meendum Sandhippoma"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>
        </div>

        <div class="simple-video-item">
          <div class="simple-video-title">BAD</div>
          <div class="simple-video-player">
            <iframe
              src="https://www.youtube.com/embed/axCoGgE0j9I"
              title="BAD"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>
        </div>

        <div class="simple-video-item">
          <div class="simple-video-title">Tattoo Hakiseni</div>
          <div class="simple-video-player">
            <iframe
              src="https://www.youtube.com/embed/XlHEvbSqd6c"
              title="Tattoo Hakiseni"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>
        </div>

        <div class="simple-video-item">
          <div class="simple-video-title">Delivery</div>
          <div class="simple-video-player">
            <iframe
              src="https://www.youtube.com/embed/fBHjXuF6UL4"
              title="Delivery"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>
        </div>

        <div class="simple-video-item">
          <div class="simple-video-title">Ex Lover</div>
          <div class="simple-video-player">
            <iframe
              src="https://www.youtube.com/embed/izhp9cG68Lo"
              title="Ex Lover"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>
        </div>

        <div class="simple-video-item">
          <div class="simple-video-title">Rudra on Fire</div>
          <div class="simple-video-player">
            <iframe
              src="https://www.youtube.com/embed/Z9qpH6KVCmk"
              title="Rudra on Fire"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>
        </div>

      </div>
    </section>

  </main>
</body>
</html>
