<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album Song | Eashan Studio Works</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="studios.css">
  <link rel="stylesheet" href="service-detail.css">
</head>
<body class="studio-page service-detail-page simple-work-page">
  <a href="work.html" class="return-home studio-return-home">Back to Works</a>

  <header class="inner-hero studio-hero service-detail-hero">
    <div class="studio-hero-content reveal active">
      <p class="section-label">Work Category</p>
      <h1>Album Song</h1>
      <p class="studio-hero-subtitle">Music-led work with strong mood, rhythm, and artist identity.</p>
    </div>
  </header>

  <main class="simple-work-shell">

    <!-- Yet to Release Section -->
    <section class="simple-video-section reveal" aria-label="Yet to Release">
      <div class="simple-video-header">
        <h2>Yet to Release</h2>
      </div>
      <div class="simple-video-grid">
        <div class="simple-video-item">
          <img src="poster/first look FINAL.jpg" alt="First Look poster">
        </div>
      </div>
    </section>

    <!-- Released Works Section -->
    <section class="simple-video-section reveal" aria-label="Released Works">
      <div class="simple-video-header">
        <h2>Released Works</h2>
      </div>
      <div class="album-video-grid">

        <article class="album-video-card">
          <h2>Being Indian</h2>
          <div class="album-video-player">
            <iframe src="https://www.youtube.com/embed/Pvy4VcD7G_4" title="Being Indian album song" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </article>

        <article class="album-video-card">
          <h2>Indian777</h2>
          <div class="album-video-player">
            <iframe src="https://www.youtube.com/embed/Uuc1l3ssOFk" title="Indian777 album song" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </article>

        <article class="album-video-card">
          <h2>Ex Lover</h2>
          <div class="album-video-player">
            <iframe src="https://www.youtube.com/embed/izhp9cG68Lo" title="Ex Lover album song" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </article>

        <article class="album-video-card">
          <h2>Ex Lover Full</h2>
          <div class="album-video-player">
            <iframe src="https://www.youtube.com/embed/3YxsMpi14y8" title="Ex Lover Full album song" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </article>

        <article class="album-video-card">
          <h2>Tattoo Hakiseni</h2>
          <div class="album-video-player">
            <iframe src="https://www.youtube.com/embed/XlHEvbSqd6c" title="Tattoo Hakiseni album song" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </article>

        <article class="album-video-card">
          <h2>Preethiya Bangara</h2>
          <div class="album-video-player">
            <iframe src="https://www.youtube.com/embed/R2q3VFtov24" title="Preethiya Bangara album song" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
